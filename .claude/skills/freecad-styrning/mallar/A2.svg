     sammanstallning.py som en symbol nere till vänster om titelblocket (x 274-404).
     Redigerbara fält: Foretag, Adress1-3, Uppdrag, RitadAv, Datum, Handlaggare, Ansvarig, Objekt1-3, Skala, Nummer, Bet,
     RevBet, RevAnt, RevText, RevDatum, RevSign, StomnatNummer, Systemlinje, Etapp, Antal.
